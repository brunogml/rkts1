<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rKTs – Dual Reading</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../configuration/favicon-32x32.png">
    <link rel="stylesheet" href="../configuration/style.css">

    <script src="https://cdn.jsdelivr.net/npm/openseadragon@4.1/build/openseadragon/openseadragon.min.js"></script>

    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #1a1a1a; color: #e0e0e0; }

        /* Top bar */
        #topbar {
            height: 46px; background: #fff; border-bottom: 1px solid #dee2e6;
            display: flex; align-items: center; gap: 0.7rem;
            padding: 0 0.9rem; flex-shrink: 0;
        }
        #topbar .logo img { height: 28px; width: auto; display: block; }
        #topbar .logo-text { color: #2c4a6e; font-weight: 700; font-size: 1.05rem; }
        #topbar .divider { width: 1px; height: 22px; background: #dee2e6; flex-shrink: 0; }
        #topbar .meta-item { font-size: 0.75rem; color: #6c757d; white-space: nowrap; }
        #topbar .meta-item strong { color: #343a40; font-weight: 600; }
        #topbar .back-link { color: #2c6fad; font-size: 0.82rem; text-decoration: none; white-space: nowrap; }
        #topbar .back-link:hover { color: #1a4f8a; text-decoration: underline; }

        /* Main layout */
        #main-area {
            display: flex; flex-direction: column;
            height: calc(100vh - 46px); overflow: hidden;
        }

        /* Each pane */
        .dual-pane {
            display: flex; flex-direction: column;
            flex: 1 1 0; min-height: 80px; overflow: hidden;
        }

        /* Nav bar for each pane */
        .pane-nav {
            height: 38px; background: #f8f9fa; border-bottom: 1px solid #dee2e6;
            display: flex; align-items: center; gap: 0.4rem;
            padding: 0 0.8rem; flex-shrink: 0;
        }
        .pane-label {
            font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
            color: #fff; font-weight: 700; background: #2c4a6e;
            border-radius: 3px; padding: 1px 7px; flex-shrink: 0;
        }
        .pane-label.pane2 { background: #5a6e2c; }
        .page-disp { font-size: 0.9rem; min-width: 70px; text-align: center; color: #343a40; font-weight: 600; }
        .page-cnt  { font-size: 0.72rem; color: #adb5bd; }
        .page-inp  {
            width: 64px; font-size: 0.82rem; background: #fff;
            border: 1px solid #ced4da; color: #343a40; border-radius: 3px;
            padding: 2px 5px; text-align: center;
        }
        .page-inp:focus { outline: none; border-color: #2c6fad; box-shadow: 0 0 0 2px rgba(44,111,173,.15); }
        .align-badge {
            font-size: 0.7rem; color: #6c757d; margin-left: 0.4rem;
            font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 200px;
        }

        /* Viewer wrap */
        .viewer-wrap { flex: 1 1 0; position: relative; min-height: 0; background: #111; }
        .osd-viewer  { width: 100%; height: 100%; }

        .loading-ov {
            position: absolute; inset: 0; display: flex;
            align-items: center; justify-content: center;
            flex-direction: column; gap: 0.8rem; background: #111; z-index: 10;
        }
        .loading-ov .spinner-border { width: 2rem; height: 2rem; color: #6ea8d8; }
        .loading-ov .load-msg { font-size: 0.78rem; color: #666; }
        .error-ov {
            position: absolute; inset: 0; display: none;
            align-items: center; justify-content: center; background: #111; z-index: 10;
        }
        .error-ov .alert { background: #2a1a1a; border-color: #6b2a2a; color: #e8a0a0; max-width: 440px; }

        /* Manifest bar */
        .manifest-bar {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(2px);
            padding: 1px 8px; display: flex; align-items: center; gap: 0.3rem;
            font-size: 0.67rem; font-family: monospace;
            white-space: nowrap; overflow: hidden; z-index: 5;
        }
        .manifest-bar span { color: #adb5bd; flex-shrink: 0; }
        .manifest-bar a { color: #6ea8d8; text-overflow: ellipsis; overflow: hidden; text-decoration: none; }
        .manifest-bar a:hover { color: #90c4f0; text-decoration: underline; }

        /* Resize handle */
        #resize-handle {
            height: 6px; cursor: row-resize; flex-shrink: 0;
            background: #dee2e6; border-top: 1px solid #c8d6e5; border-bottom: 1px solid #c8d6e5;
        }
        #resize-handle:hover, #resize-handle.dragging { background: #90c4f0; }

        /* Nav buttons */
        .btn-nav {
            background: #fff; border: 1px solid #ced4da; color: #495057;
            padding: 2px 8px; border-radius: 3px; font-size: 0.82rem;
            cursor: pointer; transition: background 0.1s; white-space: nowrap; line-height: 1.6;
        }
        .btn-nav:hover:not(:disabled) { background: #e9ecef; color: #212529; border-color: #adb5bd; }
        .btn-nav:disabled { opacity: 0.35; cursor: default; }

        .nav-right { margin-left: auto; display: flex; align-items: center; gap: 0.4rem; }
    </style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
    <div class="logo">
        <a href="../index.html">
            <img src="../configuration/rkts-logo.png" alt="rKTs"
                 onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block'">
        </a>
        <span id="logo-fallback" class="logo-text" style="display:none">rKTs</span>
    </div>
    <div class="divider"></div>
    <a href="#" class="back-link" id="back-link"><i class="bi bi-arrow-left me-1"></i><span id="back-label">Back</span></a>
    <div class="divider"></div>
    <span style="font-size:0.75rem;color:#2c4a6e;font-weight:700;letter-spacing:0.03em;">
        <i class="bi bi-layout-split me-1"></i>Dual Reading
    </span>
    <div class="divider"></div>
    <div class="meta-item"><strong>1&nbsp;</strong><span id="meta-coll1">—</span></div>
    <div class="meta-item"><strong>vs&nbsp;</strong><span id="meta-coll2">—</span></div>
    <div class="meta-item"><strong>rKTs&nbsp;</strong><span id="meta-rkts">—</span></div>
</div>

<!-- Main area: two panes + resize handle -->
<div id="main-area">

    <!-- ═══ Pane 1 (primary) ════════════════════════════════════════════════ -->
    <div class="dual-pane" id="pane1">
        <div class="pane-nav" id="nav1">
            <span class="pane-label">1 · <span id="coll1-label">—</span></span>
            <button class="btn-nav" id="p1-first" title="First"><i class="bi bi-skip-start-fill"></i></button>
            <button class="btn-nav" id="p1-prev"  title="Previous (←)"><i class="bi bi-chevron-left"></i></button>
            <span class="page-disp" id="p1-page">—</span>
            <button class="btn-nav" id="p1-next"  title="Next (→)"><i class="bi bi-chevron-right"></i></button>
            <button class="btn-nav" id="p1-last"  title="Last"><i class="bi bi-skip-end-fill"></i></button>
            <span class="align-badge" id="align-badge" title="Current alignment"></span>
            <div class="nav-right">
                <span class="page-cnt" id="p1-cnt"></span>
                <input type="text" class="page-inp" id="p1-input" placeholder="go to…">
                <button class="btn-nav" id="p1-home" title="Reset zoom"><i class="bi bi-arrows-fullscreen"></i></button>
            </div>
        </div>
        <div class="viewer-wrap" id="viewer1-wrap">
            <div class="loading-ov" id="load1">
                <div class="spinner-border" role="status"></div>
                <div class="load-msg" id="load1-msg">Loading…</div>
            </div>
            <div class="error-ov" id="err1">
                <div class="alert"><i class="bi bi-exclamation-triangle me-2"></i><span id="err1-msg">Error</span></div>
            </div>
            <div class="osd-viewer" id="viewer1"></div>
            <div class="manifest-bar"><span>IIIF&nbsp;</span><a id="murl1" href="#" target="_blank"></a></div>
        </div>
    </div>

    <!-- Resize handle -->
    <div id="resize-handle"></div>

    <!-- ═══ Pane 2 (aligned collection) ════════════════════════════════════ -->
    <div class="dual-pane" id="pane2">
        <div class="pane-nav" id="nav2">
            <span class="pane-label pane2">2 · <span id="coll2-label">—</span></span>
            <button class="btn-nav" id="p2-first" title="First"><i class="bi bi-skip-start-fill"></i></button>
            <button class="btn-nav" id="p2-prev"  title="Previous (Shift+←)"><i class="bi bi-chevron-left"></i></button>
            <span class="page-disp" id="p2-page">—</span>
            <button class="btn-nav" id="p2-next"  title="Next (Shift+→)"><i class="bi bi-chevron-right"></i></button>
            <button class="btn-nav" id="p2-last"  title="Last"><i class="bi bi-skip-end-fill"></i></button>
            <div class="nav-right">
                <span class="page-cnt" id="p2-cnt"></span>
                <input type="text" class="page-inp" id="p2-input" placeholder="go to…">
                <button class="btn-nav" id="p2-home" title="Reset zoom"><i class="bi bi-arrows-fullscreen"></i></button>
            </div>
        </div>
        <div class="viewer-wrap" id="viewer2-wrap">
            <div class="loading-ov" id="load2">
                <div class="spinner-border" role="status"></div>
                <div class="load-msg" id="load2-msg">Loading…</div>
            </div>
            <div class="error-ov" id="err2">
                <div class="alert"><i class="bi bi-exclamation-triangle me-2"></i><span id="err2-msg">Error</span></div>
            </div>
            <div class="osd-viewer" id="viewer2"></div>
            <div class="manifest-bar"><span>IIIF&nbsp;</span><a id="murl2" href="#" target="_blank"></a></div>
        </div>
    </div>

</div><!-- /main-area -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function () {
    'use strict';

    /* ── Paths ───────────────────────────────────────────────────────────── */
    const COLL_BASE = '../data/collections';

    /* ── URL params ──────────────────────────────────────────────────────── */
    const P      = new URLSearchParams(window.location.search);
    const rkts   = (P.get('rkts')   || '').trim();  // e.g. K11
    const coll1  = (P.get('coll')   || '').trim();  // primary sigla e.g. D
    const title1 = (P.get('title')  || '').trim();  // e.g. MW22084
    const vol1   = (P.get('vol')    || '').trim();  // volref e.g. 0916
    const sec1   = (P.get('sec')    || '').trim();
    const page1  = (P.get('page')   || '').trim();  // starting page for pane1
    const coll2  = (P.get('coll2')  || '').trim();  // aligned sigla e.g. H
    const setid2 = (P.get('setid2') || '').trim();  // e.g. 26071 (without MW prefix)
    const vol2   = (P.get('vol2')   || '').trim();  // volref e.g. 4058
    const pag2   = (P.get('pag2')   || '').trim();  // aligned starting page for pane2

    /* ── UI helpers ──────────────────────────────────────────────────────── */
    function esc(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function show(el) { if (el) el.style.display = 'flex'; }
    function hide(el) { if (el) el.style.display = 'none'; }

    /* ── Topbar ──────────────────────────────────────────────────────────── */
    document.getElementById('meta-coll1').textContent  = coll1 || '—';
    document.getElementById('meta-coll2').textContent  = coll2 || '—';
    document.getElementById('meta-rkts').textContent   = rkts  || '—';
    document.getElementById('coll1-label').textContent = coll1 || '—';
    document.getElementById('coll2-label').textContent = coll2 || '—';

    const backLink  = document.getElementById('back-link');
    const backLabel = document.getElementById('back-label');
    backLabel.textContent = rkts || 'Back to images';
    backLink.href = rkts
        ? 'images.html?title=' + encodeURIComponent(title1)
          + '&coll='  + encodeURIComponent(coll1)
          + '&vol='   + encodeURIComponent(vol1)
          + '&rkts='  + encodeURIComponent(rkts)
          + (sec1  ? '&sec='  + encodeURIComponent(sec1)  : '')
          + (page1 ? '&page=' + encodeURIComponent(page1) : '')
        : 'javascript:history.back()';
    if (rkts) document.title = 'rKTs \u2013 Dual\u00a0' + rkts + '\u00a0' + coll1 + '\u00a0vs\u00a0' + coll2;

    /* ── State ───────────────────────────────────────────────────────────── */
    let osd1 = null, pages1 = [], idx1 = 0, tmpl1 = null, cropData1 = null, pendingCrop1 = null;
    let osd2 = null, pages2 = [], idx2 = 0, tmpl2 = null, cropData2 = null, pendingCrop2 = null;

    // alignMap1[i] = pag2 string (last known alignment at pages1[i])
    let alignRaw  = [];
    let alignMap1 = [];

    /* ── Alignment XML ───────────────────────────────────────────────────── */
    function loadAlignXml() {
        if (!rkts) return Promise.resolve();
        const prefix = rkts.match(/^([A-Za-z]+)/)?.[1] || '';
        const url = '../alignments/' + encodeURIComponent(prefix) + '/' + encodeURIComponent(rkts) + '.xml';
        return fetch(url)
            .then(r => r.ok ? r.text() : '')
            .catch(() => '')
            .then(xmlText => {
                if (!xmlText) return;
                const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
                const t   = (el, tag) => { const n = el ? el.querySelector(tag) : null; return n ? n.textContent.trim() : ''; };
                alignRaw  = Array.from(doc.querySelectorAll('item')).map(item => {
                    const refEl = item.querySelector('ref');
                    return {
                        pag1: t(refEl, 'pag'),
                        vol1: t(refEl, 'vol'),
                        sec1: t(refEl, 'sec'),
                        aligns: Array.from(item.querySelectorAll('align')).map(a => ({
                            coll: t(a,'coll'), setid: t(a,'setid'), vol: t(a,'vol'), sec: t(a,'sec'), pag: t(a,'pag')
                        }))
                    };
                });
            });
    }

    function buildAlignMap() {
        // For each page of pane1, walk alignRaw to find the last known pag2 up to that point.
        let last = pag2 || null;
        alignMap1 = pages1.map(p => {
            const pag = p.pagination;
            for (const item of alignRaw) {
                if (item.pag1 !== pag) continue;
                if (item.vol1 && item.vol1 !== vol1) continue;
                for (const a of item.aligns) {
                    if (a.coll === coll2 && a.pag) last = a.pag;
                }
                break;
            }
            return last;
        });
    }

    /* ── Crop helpers ────────────────────────────────────────────────────── */
    function computeCrop(page, cropData, iiifW) {
        if (!cropData || !cropData.files) return null;
        if (!page || !page.file || !page.location) return null;
        const fileNum = parseInt(page.file, 10);
        if (isNaN(fileNum) || fileNum < 1) return null;
        const entry = cropData.files[fileNum - 1];
        if (!entry || !entry.pages) return null;
        const pageIdx = (page.location === 'top') ? 0 : 1;
        if (!entry.pages[pageIdx]) return null;
        const rect = entry.pages[pageIdx].minAreaRect;
        const refW = entry.width;
        if (!refW) return null;
        const rapp = iiifW / refW;
        return {
            x: Math.round((rect[0] - rect[2] / 2) * rapp),
            y: Math.round((rect[1] - rect[3] / 2) * rapp),
            w: Math.round(rect[2] * rapp),
            h: Math.round(rect[3] * rapp)
        };
    }

    function applyCrop(osd, crop) {
        if (!crop) return;
        const tiledImage = osd.world.getItemAt(0);
        if (!tiledImage) return;
        const imageRect    = new OpenSeadragon.Rect(crop.x, crop.y, crop.w, crop.h);
        tiledImage.setClip(imageRect);
        const viewportRect = tiledImage.imageToViewportRectangle(imageRect);
        osd.viewport.fitBounds(viewportRect, true);
    }

    /* ── IIIF helpers ────────────────────────────────────────────────────── */
    function iiifUrl(fileId, tmpl, vol) {
        if (tmpl) {
            const volSafe = (vol || '').replace(/-/g, '_');
            return tmpl.replace('yyy', encodeURIComponent(volSafe))
                       .replace('xxx', encodeURIComponent(fileId));
        }
        if (/^https?:\/\//i.test(fileId)) {
            const base = fileId.replace(/\/+$/, '');
            return base.endsWith('/info.json') ? base : base + '/info.json';
        }
        return 'https://iiif.bdrc.io/' + fileId + '/info.json';
    }

    function normalizeIiifInfo(info) {
        if (Array.isArray(info.profile) && info.profile.length &&
                typeof info.profile[0] === 'object' && info.profile[0] !== null) {
            const p0 = info.profile[0], p1 = info.profile[1] || {};
            const lvl = p0['@id'] || 'http://iiif.io/api/image/2/level1.json';
            const merged = {};
            [p0, p1].forEach(src => {
                Object.keys(src).forEach(k => { if (k !== '@id' && src[k] != null) merged[k] = src[k]; });
            });
            info.profile = [lvl, merged];
        }
        return info;
    }

    /* ── OSD init ────────────────────────────────────────────────────────── */
    function initOsd(containerId) {
        return OpenSeadragon({
            id:                    containerId,
            prefixUrl:             'https://cdn.jsdelivr.net/npm/openseadragon@4.1/build/openseadragon/images/',
            showNavigationControl: false,
            animationTime:         0.3,
            blendTime:             0.1,
            constrainDuringPan:    false,
            maxZoomPixelRatio:     4,
            minZoomImageRatio:     0.5,
            visibilityRatio:       0.5,
            defaultZoomLevel:      0,
            tileSources:           null
        });
    }

    /* ── Open image in a viewer ──────────────────────────────────────────── */
    function openInViewer(osd, page, tmpl, vol, cropData, pendingCropRef, loadEl, loadMsgEl, errEl, murlEl) {
        const fileId = page.file;
        const url    = iiifUrl(fileId, tmpl, vol);
        loadMsgEl.textContent = 'Loading image…';
        show(loadEl);
        hide(errEl);
        if (murlEl) { murlEl.textContent = url; murlEl.href = url; }
        fetch(url)
            .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(info => {
                info = normalizeIiifInfo(info);
                if (!info['@id']) info['@id'] = url.replace(/\/info\.json$/, '');
                pendingCropRef.value = computeCrop(page, cropData, info.width);
                osd.open(info);
            })
            .catch(err => {
                hide(loadEl);
                errEl.querySelector('span').textContent = 'Failed to load image: ' + err.message;
                show(errEl);
                errEl.style.display = 'flex';
            });
    }

    function attachOsdHandlers(osd, loadEl, getPendingCrop) {
        osd.addHandler('open', function () {
            const crop = getPendingCrop();
            if (crop) applyCrop(osd, crop);
            let done = false;
            function finish() { if (!done) { done = true; hide(loadEl); } }
            osd.addOnceHandler('tile-drawn', finish);
            setTimeout(finish, 8000);
        });
        osd.addHandler('open-failed', function () { hide(loadEl); });
    }

    /* ── Nav state elements ──────────────────────────────────────────────── */
    const p1PageEl   = document.getElementById('p1-page');
    const p1CntEl    = document.getElementById('p1-cnt');
    const p2PageEl   = document.getElementById('p2-page');
    const p2CntEl    = document.getElementById('p2-cnt');
    const alignBadge = document.getElementById('align-badge');
    const load1      = document.getElementById('load1');
    const load1Msg   = document.getElementById('load1-msg');
    const err1       = document.getElementById('err1');
    const murl1      = document.getElementById('murl1');
    const load2      = document.getElementById('load2');
    const load2Msg   = document.getElementById('load2-msg');
    const err2       = document.getElementById('err2');
    const murl2      = document.getElementById('murl2');

    // Wrap pendingCrop in a ref object so openInViewer can write through it
    const crop1Ref = { value: null };
    const crop2Ref = { value: null };

    function updateNav1() {
        const p   = pages1[idx1];
        const pag = p ? (p.pagination || ('p' + (idx1 + 1))) : '—';
        p1PageEl.textContent = pag;
        p1CntEl.textContent  = (idx1 + 1) + '\u202f/\u202f' + pages1.length;
        document.getElementById('p1-first').disabled = idx1 === 0;
        document.getElementById('p1-prev').disabled  = idx1 === 0;
        document.getElementById('p1-next').disabled  = idx1 === pages1.length - 1;
        document.getElementById('p1-last').disabled  = idx1 === pages1.length - 1;
        const alignedPag = alignMap1[idx1] || null;
        alignBadge.textContent = alignedPag ? ('\u2192\u00a0' + coll2 + '\u00a0' + alignedPag) : '';
        const sp = new URLSearchParams(window.location.search);
        sp.set('page', pag);
        history.replaceState(null, '', '?' + sp.toString());
    }

    function updateNav2() {
        const p   = pages2[idx2];
        const pag = p ? (p.pagination || ('p' + (idx2 + 1))) : '—';
        p2PageEl.textContent = pag;
        p2CntEl.textContent  = (idx2 + 1) + '\u202f/\u202f' + pages2.length;
        document.getElementById('p2-first').disabled = idx2 === 0;
        document.getElementById('p2-prev').disabled  = idx2 === 0;
        document.getElementById('p2-next').disabled  = idx2 === pages2.length - 1;
        document.getElementById('p2-last').disabled  = idx2 === pages2.length - 1;
    }

    function goTo1(newIdx, syncPane2) {
        if (newIdx < 0 || newIdx >= pages1.length) return;
        idx1 = newIdx;
        updateNav1();
        crop1Ref.value = null;
        openInViewer(osd1, pages1[idx1], tmpl1, vol1, cropData1, crop1Ref, load1, load1Msg, err1, murl1);
        if (syncPane2) {
            const alignedPag = alignMap1[idx1];
            if (alignedPag && pages2.length) {
                const found = pages2.findIndex(p => (p.pagination || '') === alignedPag);
                if (found >= 0 && found !== idx2) {
                    idx2 = found;
                    updateNav2();
                    crop2Ref.value = null;
                    openInViewer(osd2, pages2[idx2], tmpl2, vol2, cropData2, crop2Ref, load2, load2Msg, err2, murl2);
                }
            }
        }
    }

    function goTo2(newIdx) {
        if (newIdx < 0 || newIdx >= pages2.length) return;
        idx2 = newIdx;
        updateNav2();
        crop2Ref.value = null;
        openInViewer(osd2, pages2[idx2], tmpl2, vol2, cropData2, crop2Ref, load2, load2Msg, err2, murl2);
    }

    /* ── Event binding ───────────────────────────────────────────────────── */
    function bindEvents() {
        document.getElementById('p1-first').addEventListener('click', () => goTo1(0, true));
        document.getElementById('p1-prev') .addEventListener('click', () => goTo1(idx1 - 1, true));
        document.getElementById('p1-next') .addEventListener('click', () => goTo1(idx1 + 1, true));
        document.getElementById('p1-last') .addEventListener('click', () => goTo1(pages1.length - 1, true));
        document.getElementById('p1-home') .addEventListener('click', () => { if (osd1) osd1.viewport.goHome(true); });

        document.getElementById('p2-first').addEventListener('click', () => goTo2(0));
        document.getElementById('p2-prev') .addEventListener('click', () => goTo2(idx2 - 1));
        document.getElementById('p2-next') .addEventListener('click', () => goTo2(idx2 + 1));
        document.getElementById('p2-last') .addEventListener('click', () => goTo2(pages2.length - 1));
        document.getElementById('p2-home') .addEventListener('click', () => { if (osd2) osd2.viewport.goHome(true); });

        document.getElementById('p1-input').addEventListener('keydown', function (e) {
            if (e.key !== 'Enter') return;
            const target = this.value.trim(); this.value = '';
            const found = pages1.findIndex(p => (p.pagination || '') === target);
            if (found >= 0) { goTo1(found, true); }
            else { flashError(this); }
        });

        document.getElementById('p2-input').addEventListener('keydown', function (e) {
            if (e.key !== 'Enter') return;
            const target = this.value.trim(); this.value = '';
            const found = pages2.findIndex(p => (p.pagination || '') === target);
            if (found >= 0) { goTo2(found); }
            else { flashError(this); }
        });

        // Keyboard: ←/→ for pane1, Shift+←/→ for pane2
        document.addEventListener('keydown', e => {
            if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
            if (e.shiftKey) {
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); goTo2(idx2 + 1); }
                if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); goTo2(idx2 - 1); }
            } else {
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); goTo1(idx1 + 1, true); }
                if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); goTo1(idx1 - 1, true); }
                if (e.key === 'Home') { e.preventDefault(); goTo1(0, true); }
                if (e.key === 'End')  { e.preventDefault(); goTo1(pages1.length - 1, true); }
            }
        });
    }

    function flashError(input) {
        input.style.borderColor = '#a04040';
        setTimeout(() => { input.style.borderColor = '#ced4da'; }, 1000);
    }

    /* ── Resize handle ───────────────────────────────────────────────────── */
    (function () {
        const handle = document.getElementById('resize-handle');
        const pane1  = document.getElementById('pane1');
        let dragging = false, startY = 0, startH = 0;
        handle.addEventListener('mousedown', e => {
            dragging = true; startY = e.clientY; startH = pane1.offsetHeight;
            handle.classList.add('dragging');
            document.body.style.cursor = 'row-resize';
            document.body.style.userSelect = 'none';
        });
        document.addEventListener('mousemove', e => {
            if (!dragging) return;
            const mainH = document.getElementById('main-area').offsetHeight;
            const newH  = Math.max(80, Math.min(mainH - 120, startH + (e.clientY - startY)));
            pane1.style.flex   = 'none';
            pane1.style.height = newH + 'px';
        });
        document.addEventListener('mouseup', () => {
            if (!dragging) return;
            dragging = false;
            handle.classList.remove('dragging');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            if (osd1) osd1.viewport && osd1.viewport.goHome(true);
            if (osd2) osd2.viewport && osd2.viewport.goHome(true);
        });
    })();

    /* ── Pages array from JSON ───────────────────────────────────────────── */
    function jsonToPages(data) {
        return Object.keys(data)
            .filter(k => /^\d+$/.test(k))
            .sort((a, b) => parseInt(a, 10) - parseInt(b, 10))
            .map(k => data[k])
            .filter(Boolean);
    }

    function findPageIdx(pages, pag, sec) {
        let fallback = -1;
        for (let i = 0; i < pages.length; i++) {
            const lbl = pages[i].pagination || ('p' + (i + 1));
            if (lbl === pag) {
                if (!sec || pages[i].psection === sec) return i;
                if (fallback < 0) fallback = i;
            }
        }
        return fallback >= 0 ? fallback : 0;
    }

    /* ── Fatal error ─────────────────────────────────────────────────────── */
    function showFatalError(msg) {
        const el = document.createElement('div');
        el.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#111;z-index:999;';
        el.innerHTML = '<div style="background:#2a1a1a;border:1px solid #6b2a2a;color:#e8a0a0;padding:1.2rem 1.8rem;border-radius:6px;max-width:480px;">'
            + '<i class="bi bi-exclamation-triangle me-2"></i>' + esc(msg) + '</div>';
        document.body.appendChild(el);
    }

    /* ── Bootstrap ───────────────────────────────────────────────────────── */
    if (!coll1 || !title1 || !vol1 || !coll2 || !setid2 || !vol2) {
        showFatalError('Missing required URL parameters.');
    } else {

        const jsonUrl1  = COLL_BASE + '/' + encodeURIComponent(coll1)
                        + '/' + encodeURIComponent(title1)
                        + '/' + encodeURIComponent(vol1) + '.json';
        const maniUrl1  = COLL_BASE + '/' + encodeURIComponent(coll1)
                        + '/' + encodeURIComponent(title1) + '/manifest.txt';
        const cropUrl1  = COLL_BASE + '/' + encodeURIComponent(coll1)
                        + '/' + encodeURIComponent(title1) + '_Crop'
                        + '/' + encodeURIComponent(vol1) + '.json';

        const jsonUrl2  = COLL_BASE + '/' + encodeURIComponent(coll2)
                        + '/MW' + encodeURIComponent(setid2)
                        + '/' + encodeURIComponent(vol2) + '.json';
        const maniUrl2  = COLL_BASE + '/' + encodeURIComponent(coll2)
                        + '/MW' + encodeURIComponent(setid2) + '/manifest.txt';
        const cropUrl2  = COLL_BASE + '/' + encodeURIComponent(coll2)
                        + '/MW' + encodeURIComponent(setid2) + '_Crop'
                        + '/' + encodeURIComponent(vol2) + '.json';

        load1Msg.textContent = 'Loading volume index…';
        load2Msg.textContent = 'Loading volume index…';

        osd1 = initOsd('viewer1');
        osd2 = initOsd('viewer2');
        attachOsdHandlers(osd1, load1, () => { const c = crop1Ref.value; crop1Ref.value = null; return c; });
        attachOsdHandlers(osd2, load2, () => { const c = crop2Ref.value; crop2Ref.value = null; return c; });

        Promise.all([
            fetch(jsonUrl1).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status + ' – vol1 JSON'); return r.json(); }),
            fetch(jsonUrl2).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status + ' – vol2 JSON'); return r.json(); }),
            fetch(maniUrl1).then(r => r.ok ? r.text() : null).catch(() => null),
            fetch(maniUrl2).then(r => r.ok ? r.text() : null).catch(() => null),
            fetch(cropUrl1).then(r => r.ok ? r.json() : null).catch(() => null),
            fetch(cropUrl2).then(r => r.ok ? r.json() : null).catch(() => null),
            loadAlignXml()
        ])
        .then(([data1, data2, tmplText1, tmplText2, cropJson1, cropJson2]) => {
            tmpl1     = tmplText1 ? tmplText1.trim() : null;
            tmpl2     = tmplText2 ? tmplText2.trim() : null;
            cropData1 = cropJson1 || null;
            cropData2 = cropJson2 || null;

            pages1 = jsonToPages(data1);
            pages2 = jsonToPages(data2);

            if (!pages1.length) throw new Error('No pages in vol1 JSON.');
            if (!pages2.length) throw new Error('No pages in vol2 JSON.');

            buildAlignMap();
            bindEvents();

            idx1 = page1 ? findPageIdx(pages1, page1, sec1) : 0;
            const startPag2 = pag2 || alignMap1[idx1] || null;
            idx2 = startPag2 ? findPageIdx(pages2, startPag2, '') : 0;

            updateNav1();
            updateNav2();

            crop1Ref.value = null;
            openInViewer(osd1, pages1[idx1], tmpl1, vol1, cropData1, crop1Ref, load1, load1Msg, err1, murl1);
            crop2Ref.value = null;
            openInViewer(osd2, pages2[idx2], tmpl2, vol2, cropData2, crop2Ref, load2, load2Msg, err2, murl2);
        })
        .catch(err => {
            showFatalError('Could not load data: ' + err.message);
            hide(load1); hide(load2);
        });
    }

})();
</script>
</body>
</html>
