<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rKTs – Images</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../configuration/favicon-32x32.png">
    <link rel="stylesheet" href="../configuration/style.css">

    <script src="https://cdn.jsdelivr.net/npm/openseadragon@4.1/build/openseadragon/openseadragon.min.js"></script>

    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #1a1a1a; color: #e0e0e0; }

        /* Top bar */
        #topbar {
            height: 52px; background: #fff; border-bottom: 1px solid #dee2e6;
            display: flex; align-items: center; gap: 0.8rem;
            padding: 0 0.9rem; flex-shrink: 0; overflow: hidden;
        }
        #topbar .logo img { height: 32px; width: auto; display: block; }
        #topbar .logo-text { color: #2c4a6e; font-weight: 700; font-size: 1.05rem; }
        #topbar .divider   { width: 1px; height: 22px; background: #dee2e6; flex-shrink: 0; }
        #topbar .back-link { color: #2c6fad; font-size: 0.82rem; text-decoration: none; white-space: nowrap; }
        #topbar .back-link:hover { color: #1a4f8a; text-decoration: underline; }

        /* Collection / volume title strip */
        #coll-title-strip {
            font-size: 0.78rem; color: #343a40; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0;
        }
        #coll-title-strip .coll-name  { font-weight: 700; color: #1a3e72; font-size:1.2rem;}
        #coll-title-strip .vol-name   { color: #6c757d; font-size:1.2rem;}

        .meta-item { font-size: 0.75rem; color: #6c757d; white-space: nowrap; }
        .meta-item strong { color: #343a40; font-weight: 600; }

        /* Provenance badges */
        .prov-group { display: flex; align-items: center; gap: 0.35rem; flex-shrink: 0; }
        .prov-label { font-size: 0.68rem; color: #adb5bd; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
        .prov-logo-link { display: inline-flex; align-items: center; text-decoration: none; opacity: 0.85; transition: opacity 0.15s; }
        .prov-logo-link:hover { opacity: 1; }
        .prov-logo-link img { height: 22px; width: auto; display: block; border-radius: 2px; }
        .prov-fallback { font-size: 0.75rem; font-weight: 700; color: #2c4a6e; padding: 1px 5px; border: 1px solid #c8d6e5; border-radius: 3px; background: #f0f5fb; white-space: nowrap; }

        /* Nav bar */
        #nav-bar {
            height: 40px; background: #f8f9fa; border-bottom: 1px solid #dee2e6;
            display: flex; align-items: center; gap: 0.4rem;
            padding: 0 0.9rem; flex-shrink: 0;
        }
        #page-label    { font-size: 0.9rem; min-width: 76px; text-align: center; color: #343a40; font-weight: 600; }
        #section-label { font-size: 0.72rem; color: #6c757d; margin-left: 0.3rem; }
        #page-count    { font-size: 0.72rem; color: #adb5bd; }
        #page-input {
            width: 68px; font-size: 0.82rem; background: #fff;
            border: 1px solid #ced4da; color: #343a40; border-radius: 3px;
            padding: 2px 6px; text-align: center;
        }
        #page-input:focus { outline: none; border-color: #2c6fad; box-shadow: 0 0 0 2px rgba(44,111,173,0.15); }
        #nav-right { margin-left: auto; display: flex; align-items: center; gap: 0.4rem; }

        /* Section selector */
        #sec-select {
            font-size: 0.78rem; background: #fff; border: 1px solid #ced4da;
            color: #343a40; border-radius: 3px; padding: 2px 4px; max-width: 110px;
        }
        #sec-select-wrap { display: none; align-items: center; gap: 0.3rem; margin-left: 0.3rem; }
        #sec-select-wrap label { font-size: 0.72rem; color: #6c757d; white-space: nowrap; }

        /* Main area */
        #main-area { display: flex; flex-direction: column; height: calc(100vh - 52px - 40px); overflow: hidden; }
        #viewer-row { display: flex; height: 750px; flex-shrink: 0; min-height: 100px; overflow: hidden; }

        /* Viewer */
        #viewer-wrap { position: relative; flex: 1 1 0; min-width: 0; background: #111; }
        #viewer { width: 100%; height: 100%; }

        /* Second viewer (coll=A dual-image layout) */
        #viewer2-wrap {
            position: relative; flex: 1 1 0; min-width: 0; background: #111;
            border-left: 2px solid #333; display: none;
        }
        #viewer2-wrap.visible { display: block; }
        #viewer2 { width: 100%; height: 100%; }
        #viewer2-label {
            position: absolute; top: 4px; left: 8px; z-index: 6;
            font-size: 0.65rem; color: #adb5bd; text-transform: uppercase;
            letter-spacing: 0.08em; pointer-events: none; background: rgba(0,0,0,0.5);
            padding: 1px 5px; border-radius: 2px;
        }
        #viewer-label {
            position: absolute; top: 4px; left: 8px; z-index: 6;
            font-size: 0.65rem; color: #adb5bd; text-transform: uppercase;
            letter-spacing: 0.08em; pointer-events: none; background: rgba(0,0,0,0.5);
            padding: 1px 5px; border-radius: 2px; display: none;
        }
        #viewer-label.visible { display: block; }

        /* Right info panel */
        #info-panel {
            width: 280px; min-width: 200px; flex-shrink: 0;
            background: #fff; border-left: 1px solid #dee2e6;
            display: flex; flex-direction: column; overflow: hidden;
        }
        #info-panel-header {
            padding: 0.4rem 0.8rem; background: #f8f9fa;
            border-bottom: 1px solid #dee2e6; flex-shrink: 0;
            font-size: 0.7rem; text-transform: uppercase;
            letter-spacing: 0.08em; color: #6c757d; font-weight: 700;
        }
        #info-panel-body { flex: 1 1 0; overflow-y: auto; padding: 0.75rem 0.85rem; }
        .info-section { margin-bottom: 1rem; }
        .info-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.07em; color: #adb5bd; font-weight: 700; margin-bottom: 0.3rem; }
        .text-title-item {
            font-size: 0.82rem; color: #212529; line-height: 1.5;
            padding: 0.3rem 0.5rem; border-left: 2px solid #c8d6e5;
            margin-bottom: 0.35rem; background: #f8f9fa; border-radius: 0 3px 3px 0;
        }
        .text-title-item .ref-badge {
            font-size: 0.7rem; font-family: monospace; color: #2c4a6e;
            background: #e8f0f8; border: 1px solid #c8d6e5; border-radius: 3px;
            padding: 0 4px; margin-right: 0.3rem;
        }
        .citation-box {
            background: #f8f9fa; border: 1px solid #dee2e6;
            border-radius: 4px; padding: 0.5rem 0.6rem;
            font-size: 0.78rem; color: #495057; line-height: 1.5;
        }
        .citation-url {
            font-family: monospace; font-size: 0.7rem; color: #6c757d;
            word-break: break-all; margin-top: 0.3rem; display: block;
        }
        .no-info { font-size: 0.78rem; color: #adb5bd; font-style: italic; }

        #manifest-bar {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.55); backdrop-filter: blur(2px);
            padding: 2px 8px; display: flex; align-items: center; gap: 0.3rem;
            font-size: 0.68rem; font-family: monospace;
            white-space: nowrap; overflow: hidden; z-index: 5;
        }
        #manifest-label { color: #adb5bd; flex-shrink: 0; }
        #manifest-url   { color: #6ea8d8; text-overflow: ellipsis; overflow: hidden; text-decoration: none; }
        #manifest-url:hover { color: #90c4f0; text-decoration: underline; }

        #loading-overlay {
            position: absolute; inset: 0; display: flex;
            align-items: center; justify-content: center;
            flex-direction: column; gap: 0.8rem; background: #111; z-index: 10;
        }
        #loading-overlay .spinner-border { width: 2.2rem; height: 2.2rem; color: #6ea8d8; }
        #loading-overlay .load-msg { font-size: 0.8rem; color: #666; }
        #error-overlay {
            position: absolute; inset: 0; display: none;
            align-items: center; justify-content: center; background: #111; z-index: 10;
        }
        #error-overlay .alert { background: #2a1a1a; border-color: #6b2a2a; color: #e8a0a0; max-width: 480px; }

        /* Etext pane */
        #etext-pane { flex: 1 1 0; min-height: 80px; background: #fff; border-top: 1px solid #dee2e6; display: flex; flex-direction: column; overflow: hidden; }
        #etext-pane.collapsed { display: none; }
        #etext-header { padding: 0.3rem 0.85rem; background: #f8f9fa; border-bottom: 1px solid #dee2e6; display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
        .etext-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: #6c757d; font-weight: 700; }
        #etext-page-badge { font-size: 0.72rem; background: #e8f5e9; border: 1px solid #a5d6a7; color: #2d6a4f; border-radius: 3px; padding: 1px 6px; font-family: monospace; }
        #etext-status { font-size: 0.72rem; color: #adb5bd; margin-left: auto; }
        #etext-body { flex: 1 1 0; overflow: auto; display: flex; flex-direction: row; align-items: flex-start; }
        #etext-main { flex: 0 0 auto; width: max-content; padding: 0.6rem 0.9rem; font-size: 0.84rem; line-height: 1.85; color: #343a40; }
        #etext-notes { flex: 0 0 auto; width: max-content; max-width: 320px; overflow-y: visible; padding: 0.6rem 0.75rem; border-left: 1px dashed #dee2e6; background: #fdfaf5; }
        #etext-notes-header { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: #c8a96e; font-weight: 700; margin-bottom: 0.4rem; }
        .eline { display: flex; gap: 0.5rem; margin-bottom: 0.1rem; }
        .eline-num  { color: #adb5bd; font-size: 0.68rem; min-width: 16px; padding-top: 3px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
        .eline-text { color: #212529; white-space: nowrap; }
        .eline-text.tib { font-size: 1.5rem; line-height: 2; }
        .text-title-item .script-text.tib { font-size: 1.5rem; }
        .no-etext { font-size: 0.78rem; color: #adb5bd; font-style: italic; }

        /* coll=A apparatus notes */
        .etext-notes-divider {
            border: none; border-top: 1px dashed #dee2e6;
            margin: 0.5rem 0 0.4rem; flex-shrink: 0;
        }
        .eline.note-line .eline-num  { color: #c8a96e; font-size: 0.65rem; min-width: 26px; }
        .eline.note-line .eline-text { color: #6c5a3a; font-size: 0.78rem; line-height: 1.6; }
        .circ-ref { color: #b05020; font-weight: 700; }
        .page-break-marker {
            display: block; font-size: 0.65rem; color: #adb5bd;
            letter-spacing: 0.06em; text-transform: uppercase;
            margin: 0.15rem 0 0.05rem; padding-left: 22px;
        }

        /* Resize handle */
        #resize-handle { height: 5px; cursor: row-resize; flex-shrink: 0; background: #dee2e6; }
        #resize-handle:hover, #resize-handle.dragging { background: #adb5bd; }

        /* Buttons */
        .btn-nav {
            background: #fff; border: 1px solid #ced4da; color: #495057;
            padding: 2px 9px; border-radius: 3px; font-size: 0.82rem;
            cursor: pointer; transition: background 0.1s; white-space: nowrap; line-height: 1.6;
        }
        .btn-nav:hover:not(:disabled) { background: #e9ecef; color: #212529; border-color: #adb5bd; }
        .btn-nav:disabled { opacity: 0.35; cursor: default; }
        .btn-nav.on { background: #d4edda; border-color: #5a9e6f; color: #2d6a4f; }

        .tib-toggle-btn { font-size: 0.7rem; padding: 1px 6px; line-height: 1.6; vertical-align: middle; opacity: 0.65; transition: opacity 0.15s; }
        .tib-toggle-btn:hover { opacity: 1; }
        .tib-toggle-btn .toggle-label { font-weight: 600; letter-spacing: 0.02em; }
    </style>
</head>

<script>
(function () {
    'use strict';

    /* ── Paths ──────────────────────────────────────────────────────── */
    const COLLS_URL  = '../data/general/collections.json';
    const COLL_BASE  = '../data/collections';   // /{coll}/{coll}.xml, /{coll}/{title}/{vol}.json etc.
    const DATA_BASE  = '../data/general';       // /Dharmanexus.txt, /persons.xml etc.
    const ETEXTS_BASE = '../data/etexts';

    /* ── URL params ─────────────────────────────────────────────────── */
    const P         = new URLSearchParams(window.location.search);
    const title     = (P.get('title') || '').trim();   // constituent e.g. MW22084
    const rkts      = (P.get('rkts')  || '').trim();   // e.g. K57
    const coll      = (P.get('coll')  || '').trim();   // sigla e.g. D
    const vol       = (P.get('vol')   || '').trim();   // volref e.g. 0951
    let   sec       = (P.get('sec')   || '').trim();
    const startPage = (P.get('page')  || '').trim();

    const GENRE_CODE = { 'Kanjur': '1', 'Canonical Collection': '1', 'Tanjur': '2', 'Old Tantra': '3' };

    const COLLATION_COLLECTIONS = ['1F','1Go','1H','1J','1L','1N','1Ng','1Q','1S','1Ty','2G','2N','2Q'];

    /* ── Topbar initial fill ──────────────────────────────────────── */
    document.getElementById('meta-coll').textContent  = coll  || '—';
    document.getElementById('meta-title').textContent = title || '—';
    document.getElementById('meta-vol').textContent   = vol   || '—';
    if (sec) document.getElementById('meta-sec').textContent = sec;
    else     document.getElementById('meta-sec-wrap').style.display = 'none';

    document.getElementById('rkts-display').textContent = rkts || 'Back';
    const backLink = document.getElementById('back-link');
    backLink.href = rkts ? 'detail.html?id=' + encodeURIComponent(rkts) : 'javascript:history.back()';

    /* ── Section selector ─────────────────────────────────────────── */
    // allSections: sorted unique psection values across all pages
    let allSections = [];

    function buildSectionSelect(pages) {
        const sections = [...new Set(pages.map(p => p.psection).filter(Boolean))];
        if (sections.length < 2) return;
        allSections = sections;
        const wrap   = document.getElementById('sec-select-wrap');

        sel.innerHTML = sections.map(s =>

        sel.addEventListener('change', function () {
            sec = this.value;
            document.getElementById('meta-sec').textContent = sec;
            document.getElementById('meta-sec-wrap').style.display = '';
            // jump to first page of that section
            const idx = pages.findIndex(p => p.psection === sec);
            if (idx >= 0) goTo(pages, idx);
            const sp = new URLSearchParams(window.location.search);
            sp.set('sec', sec);
            history.replaceState(null, '', '?' + sp.toString());
        });
    }

    /* ── Pagination helpers ───────────────────────────────────────── */
    function pagToNum(p) {
        if (!p) return -1;
        const m = p.match(/^(\d+)('?)([ab]?)$/);
        if (!m) return -1;
        const base  = parseInt(m[1], 10);
        const prime = m[2] === "'";
        const side  = m[3];
        if (prime) return base + (side === 'b' ? 0.7 : 0.6);
        return base + (side === 'b' ? 0.5 : 0);
    }

    /* ── Citation (no copy button) ────────────────────────────────── */
    function buildCitation(pag) {
        if (!collTitle || !volName) return '';
        const sec2 = sec || '';
        const text = coll + ' ' + collTitle + ', vol. ' + volName +
                     (sec2 ? ', sec. ' + sec2 : '') + ', fol. ' + pag + '.';
        const idStr = genreCode + '|' + coll + '|' + title + '|I' + vol + '|' + sec2 + '|' + pag;
        const url   = 'http://www.rkts.org/images.php?id=' + encodeURIComponent(idStr);
        return { text, url };
    }

    function renderCitation(pag) {
        const citBox = document.getElementById('citation-box');
        const cit    = buildCitation(pag);
        if (cit) {
            citBox.innerHTML = esc(cit.text) + '<br><span class="citation-url">' + esc(cit.url) + '</span>';
        } else {
            citBox.textContent = '—';
        }
    }

    /* ── Crop helpers ─────────────────────────────────────────────── */
    function buildCropSeqMap() {
        if (!cropData || !cropData.files) return;
        cropSeqMap = {};
        cropData.files.forEach((f, i) => {
            const m = (f.img_path || '').match(/-(\d+)b\./i);
            if (m) cropSeqMap[parseInt(m[1], 10)] = i;
        });
    }

    function computeCrop(page, iiifW, iiifH) {
        if (!cropData || !cropData.files) return null;
        if (!page || !page.file || !page.location) return null;
        // For path-style file IDs (e.g. "001%2F001-00001-002b") use seqMap;
        // for plain numeric IDs fall back to fileNum - 1.
        let fileIdx;
        const pathMatch = String(page.file).match(/[-](\d+)b(?:\.[^\/]*)?$/i);
        if (pathMatch && cropSeqMap) {
            const seq = parseInt(pathMatch[1], 10);
            fileIdx = cropSeqMap[seq];
            if (fileIdx === undefined) return null;
        } else {
            const fileNum = parseInt(page.file, 10);
            if (isNaN(fileNum) || fileNum < 1) return null;
            fileIdx = fileNum - 1;
        }
        const pageIdx = (page.location === 'top') ? 0 : 1;
        const entry   = cropData.files[fileIdx];
        if (!entry || !entry.pages || !entry.pages[pageIdx]) return null;
        const rect = entry.pages[pageIdx].minAreaRect;
        const refW = entry.width, refH = entry.height;
        if (!refW || !refH) return null;
        const rapp = iiifW / refW;
        return {
            x: Math.round((rect[0] - rect[2] / 2) * rapp),
            y: Math.round((rect[1] - rect[3] / 2) * rapp),
            w: Math.round(rect[2] * rapp),
            h: Math.round(rect[3] * rapp)
        };
    }

    /* ── Info panel render ────────────────────────────────────────── */
    function renderInfoPanel(pag) {
        const pagNum     = pagToNum(pag);
        const titlesList = document.getElementById('titles-list');
        const matching   = [];
        const seen       = {};

        if (catalogItems.length && pagNum >= 0) {
            catalogItems.forEach(it => {
                if (it.vol !== vol) return;
                if (sec && it.sec && it.sec !== sec) return;
                const start = it.debp ? pagToNum(it.debp + (it.debf || '')) : 0;
                const end   = it.finp ? pagToNum(it.finp + (it.finf || '')) : 99999;
                if (pagNum >= start && pagNum <= end) {
                    const key = (it.ref || '') + '|' + (it.tib || '');
                    if (!seen[key]) { seen[key] = true; matching.push(it); }
                }
            });
        }
        if (!catalogItems.length) {
            titlesList.innerHTML = '<span class="no-info">Loading catalog…</span>';
        } else if (!matching.length) {
            titlesList.innerHTML = '<span class="no-info">No text entry for this page.</span>';
        } else {
            let html = '';
            matching.forEach(it => {
                html += '<div class="text-title-item">';
                if (it.ref && it.rkts) {
                    const prefix    = (genreCode === '1') ? 'K' : 'T';
                    const detailId  = prefix + it.rkts;
                    const detailUrl = 'detail.html?id=' + encodeURIComponent(detailId);
                    html += `<a href="${detailUrl}" class="ref-badge" target="_blank" style="text-decoration:none;" title="Open ${esc(detailId)}">${esc(it.ref)}</a> `;
                } else if (it.ref) {
                    html += `<span class="ref-badge">${esc(it.ref)}</span> `;
                }
                const tibOrig = it.tib || it.skt || '';
                if (tibOrig) {
                    html += `<span class="script-text" data-lang="tib" data-original="${esc(tibOrig)}">${esc(tibOrig)}</span>`;
                } else {
                    html += '—';
                }
                html += '</div>';
            });
            titlesList.innerHTML = html;
            if (window.tibGlobalMode === 'unicode') applyTibMode('unicode');
        }

        renderCitation(pag);

        // Collation links
        const collationSection = document.getElementById('collation-section');
        const collationLinks   = document.getElementById('collation-links');
        const collKey = genreCode + coll;
        if (COLLATION_COLLECTIONS.includes(collKey) && matching.length) {
            let linkHtml = '';
            matching.forEach(it => {
                if (!it.ref) return;
                const folioCount = (it.debp && it.finp)
                    ? (parseInt(it.finp, 10) - parseInt(it.debp, 10) + 1) : 999;
                if (folioCount >= 50) return;
                linkHtml += `<a href="collation.php?ref=${encodeURIComponent(it.ref)}" target="_blank"
                    style="display:inline-flex;align-items:center;gap:0.35rem;font-size:0.8rem;
                    color:#2c6fad;text-decoration:none;padding:3px 7px;border:1px solid #c8d6e5;
                    border-radius:3px;background:#f0f5fb;margin-bottom:4px;">
                    <i class="bi bi-journals"></i> ${esc(it.ref)} – Collation</a><br>`;
            });
            if (linkHtml) { collationLinks.innerHTML = linkHtml; collationSection.style.display = ''; }
            else collationSection.style.display = 'none';
        } else {
            collationSection.style.display = 'none';
        }

        // Parallel volume links — select dropdown
        const parallelSection = document.getElementById('parallel-section');
        const parallelLinks   = document.getElementById('parallel-links');
        if (parallelConstituents.length > 1) {
            let opts = '<option value="">— choose set —</option>';
            parallelConstituents.forEach(conTitle => {
                const pp = new URLSearchParams();
                if (title) pp.set('title', title);
                if (coll)  pp.set('coll',  coll);
                if (vol)   pp.set('vol',   vol);
                pp.set('parallel', conTitle);
                if (sec)   pp.set('sec',  sec);
                if (pag)   pp.set('page', pag);

            });
            parallelLinks.innerHTML =
                `<select style="font-size:0.8rem;width:100%;border:1px solid #c8d6e5;border-radius:3px;padding:3px 5px;background:#f0f5fb;color:#2c6fad;">
                    ${opts}

            parallelLinks.querySelector('select').addEventListener('change', function () {
                if (this.value) window.open(this.value, '_blank');
                this.value = '';

        } else if (parallelConstituents.length === 1) {
            const conTitle = parallelConstituents[0];

    /* ── Alignment / Dual reading ─────────────────────────────────── */
    function loadAlignData() {
        if (!rkts) return;
        const prefix   = rkts.match(/^([A-Za-z]+)/)?.[1] || '';
        const alignUrl = '../data/alignments/' + encodeURIComponent(prefix) + '/' + encodeURIComponent(rkts) + '.xml';
        fetch(alignUrl)
            .then(r => r.ok ? r.text() : '')
            .catch(() => '')
            .then(xmlText => {
                if (!xmlText) return;
                const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
                const t   = (el, tag) => { const n = el ? el.querySelector(tag) : null; return n ? n.textContent.trim() : ''; };
                alignItems = Array.from(doc.querySelectorAll('item')).map(item => {
                    const refEl = item.querySelector('ref');
                    return {
                        pag1: t(refEl,'pag'), vol1: t(refEl,'vol'), sec1: t(refEl,'sec'),
                        aligns: Array.from(item.querySelectorAll('align')).map(a => ({
                            coll: t(a,'coll'), ref: t(a,'ref'), setid: t(a,'setid'),
                            vol: t(a,'vol'), sec: t(a,'sec'), pag: t(a,'pag')
                        }))
                    };
                });
                alignReady = true;
                if (currentPag) renderDualSection(currentPag);
            });
    }

    function renderDualSection(pag) {
        const dualSection = document.getElementById('dual-section');
        const dualLinks   = document.getElementById('dual-links');
        if (!dualSection || !dualLinks || !alignReady) { if (dualSection) dualSection.style.display = 'none'; return; }

        const matchItem = alignItems.find(it =>
            it.pag1 === pag &&
            (!it.vol1 || it.vol1 === vol) &&
            (!sec || !it.sec1 || it.sec1 === sec)
        );
        if (!matchItem || !matchItem.aligns.length) { dualSection.style.display = 'none'; return; }

        function buildUrl(a) {
            const pp = new URLSearchParams();
            pp.set('rkts', rkts); pp.set('coll', coll); pp.set('title', title); pp.set('vol', vol);
            if (sec) pp.set('sec', sec);
            pp.set('page', pag); pp.set('coll2', a.coll); pp.set('setid2', a.setid); pp.set('vol2', a.vol);
            if (a.pag) pp.set('pag2', a.pag);
            return 'dual.html?' + pp.toString();
        }

        const linkStyle = 'display:inline-flex;align-items:center;gap:0.35rem;font-size:0.8rem;' +
                          'color:#2c6fad;text-decoration:none;padding:3px 7px;border:1px solid #c8d6e5;' +
                          'border-radius:3px;background:#f0f5fb;width:100%;box-sizing:border-box;';

        const valid = matchItem.aligns.filter(a => a.coll && a.setid && a.vol);
        if (!valid.length) { dualSection.style.display = 'none'; return; }

        if (valid.length === 1) {
            const a     = valid[0];
            const label = (a.ref || a.coll) + '\u2002[' + a.coll + ']';
            dualLinks.innerHTML =

                '<i class="bi bi-layout-split"></i>\u2002' + esc(label) + '</a>';
        } else {
            let opts = '<option value="">— choose —</option>';
            valid.forEach(a => {

                opts += '<option value="' + esc(buildUrl(a)) + '">' + esc(label) + '</option>';
            });
            dualLinks.innerHTML =

                'padding:3px 5px;background:#f0f5fb;color:#2c6fad;">' + opts + '</select>';

            });

        dualSection.style.display = '';

    /* ── Dharmanexus links ────────────────────────────────────────── */

            .then(r => r.ok ? r.text() : '')
            .catch(() => '')
            .then(txt => {
                if (!txt) return;
                txt.split(/\r?\n/).forEach(line => {
                    line = line.trim(); if (!line) return;

                    if (parts.length === 2) dharmanexusMap[parts[0].trim()] = parts[1].trim();

    function renderLinksSection(pag) {
        const linksSection = document.getElementById('links-section');
        const linksList    = document.getElementById('links-list');
        if (!linksSection || !linksList) return;
        if (!dharmanexusReady || !rkts || coll !== 'D') { linksSection.style.display = 'none'; return; }

    /* ── Load collections.json + catalog XML ──────────────────────── */
    function loadInfoPanelData() {
        fetch(COLLS_URL)
            .then(r => r.ok ? r.json() : [])
            .catch(() => [])
            .then(cols => {
                cols.forEach(c => {
                    if (c.sigla !== coll) return;
                    if (title && c.constituents) {
                        if (!c.constituents.some(con => con.title === title)) return;
                    }
                    if (!collTitle && c.title) {
                        collTitle = c.title;
                        // Show collection full name in topbar
                        document.getElementById('coll-name-text').textContent = c.title;
                        document.getElementById('coll-full-name').style.display = '';
                    }
                    if (!genreCode && c.genre) genreCode = GENRE_CODE[c.genre] || '';
                    if (!textAvailable && c.notes && c.notes['text_Text Available'] === 'true') textAvailable = true;
                    if (c.constituents) {
                        if (!parallelConstituents.length) {
                            c.constituents.forEach(con => {
                                if (con.isreferenceset !== '1' && con.title && con.title !== title)
                                    parallelConstituents.push(con.title);
                            });
                        }
                        if (!volName) {
                            c.constituents.forEach(con => {
                                if (con.title === title && con.structure) {
                                    con.structure.forEach(s => {
                                        if (s.volref === vol && s.volname) {
                                            volName = s.volname;
                                            // Show vol name in topbar
                                            document.getElementById('meta-volname').textContent = ' ' + s.volname;
                                            document.getElementById('vol-name-text').textContent = s.volname;
                                            document.getElementById('vol-name-wrap').style.display = '';
                                        }
                                    });
                                }
                            });
                        }
                    }
                });

                // Provenance badges
                let digitizedBy = null, imagesBy = null;
                cols.forEach(c => {
                    if (c.sigla !== coll || !c.constituents) return;
                    c.constituents.forEach(con => {
                        if (con.title === title) {
                            if (!digitizedBy && con.digitizedby) digitizedBy = con.digitizedby;
                            if (!imagesBy   && con.imagesby)    imagesBy    = con.imagesby;
                        }
                    });
                });
                if (digitizedBy || imagesBy) {
                    fetch('../more/links.txt')
                        .then(r => r.ok ? r.text() : '')
                        .catch(() => '')
                        .then(txt => {
                            const linkMap = {};
                            (txt || '').split(/\r?\n/).forEach(line => {
                                const parts = line.split('####');
                                if (parts.length === 2) linkMap[parts[0].trim()] = parts[1].trim();
                            });
                            function fillProv(groupId, linkId, imgId, fbId, key) {
                                if (!key) return;
                                const group = document.getElementById(groupId);
                                const link  = document.getElementById(linkId);
                                const img   = document.getElementById(imgId);
                                const fb    = document.getElementById(fbId);
                                if (!group) return;
                                link.href = linkMap[key] || '#';
                                link.title = key;
                                fb.textContent = key;
                                img.alt = key;
                                img.onload  = () => { img.style.display = 'block'; fb.style.display = 'none'; };
                                img.onerror = () => { img.style.display = 'none'; fb.style.display = 'inline'; };
                                img.src = '../more/' + encodeURIComponent(key) + '.png';
                                group.style.display = '';
                            }
                            fillProv('prov-digitized','prov-digitized-link','prov-digitized-img','prov-digitized-fb', digitizedBy);
                            fillProv('prov-hosted',   'prov-hosted-link',   'prov-hosted-img',   'prov-hosted-fb',    imagesBy);
                        });
                }
                if (currentPag) renderInfoPanel(currentPag);
            });

        // Collection catalog XML
        const collXmlUrl = COLL_BASE + '/' + encodeURIComponent(coll) + '/' + encodeURIComponent(coll) + '.xml';
        fetch(collXmlUrl)
            .then(r => r.ok ? r.text() : '')
            .catch(() => '')
            .then(xmlText => {
                if (!xmlText) return;
                const doc   = new DOMParser().parseFromString(xmlText, 'application/xml');
                const items = Array.from(doc.querySelectorAll('item'));
                const t = (el, tag) => { const n = el.querySelector(tag); return n ? n.textContent.trim() : ''; };
                catalogItems = items.map(item => ({
                    ref:  t(item,'ref'), rkts: t(item,'rkts'), vol:  t(item,'vol'),
                    sec:  t(item,'sec'), debp: t(item,'debp'), debf: t(item,'debf'),
                    finp: t(item,'finp'),finf: t(item,'finf'), tib:  t(item,'tib')
                }));
                if (currentPag) renderInfoPanel(currentPag);
            });
    }

    /* ── eText ────────────────────────────────────────────────────── */
    function resolveEtextUrl() {
        return fetch(COLLS_URL)
            .then(r => r.ok ? r.json() : [])
            .catch(() => [])
            .then(cols => {
                let genre = null, volno = null;
                cols.forEach(c => {
                    if (c.sigla !== coll) return;
                    if (title && c.constituents && !c.constituents.some(con => con.title === title)) return;
                    if (!genre && c.genre) genre = c.genre;
                    if (!volno && c.constituents) {
                        c.constituents.forEach(con => {
                            if (con.title === title && con.structure && !volno) {
                                con.structure.forEach(s => {
                                    if (s.volref === vol && s.volno && !volno) {
                                        volno = s.volno;
                                        resolvedVolno = volno;
                                    }
                                });
                            }
                        });
                    }
                });
                const code = GENRE_CODE[genre];
                if (!code || !volno) return null;
                const pad = String(parseInt(volno, 10)).padStart(3, '0');
                return ETEXTS_BASE + '/' + code + coll + '/' + pad + '.txt';
            });
    }

    // Detect coll=A etext format: lines start with "{folio}.{line}(" or "{folio}.n{num}("
    function isCollAEtextFormat(txt) {
        const first = txt.trimStart().split(/\r?\n/).find(l => l.trim()) || '';
        return /^\d+\.[n\d]/.test(first);
    }

    function parseEtext(txt) {
        etextMap = {};
        if (coll === 'A' || isCollAEtextFormat(txt)) {
            // coll=A format: "{folio}.{line}({sec}): text"  or  "{folio}.n{num}({sec}): note"
            // Key etextMap by folio number (string). Each entry: { lines: [...], notes: [...] }
            const reMain = /^(\d+)\.(\d+)\(([^)]*)\):\s*(.*)/;
            const reNote = /^(\d+)\.n(\d+)\(([^)]*)\):\s*(.*)/;
            txt.split(/\r?\n/).forEach(raw => {
                let m;
                if ((m = raw.match(reNote))) {
                    const [, folio, nnum, secCode, text] = m;
                    const key = folio;
                    if (!etextMap[key]) etextMap[key] = { lines: [], notes: [] };
                    etextMap[key].notes.push({ num: nnum, text, sec: secCode });
                } else if ((m = raw.match(reMain))) {
                    const [, folio, lnum, secCode, text] = m;
                    const key = folio;
                    if (!etextMap[key]) etextMap[key] = { lines: [], notes: [] };
                    etextMap[key].lines.push({ line: lnum, text, sec: secCode });
                }
            });
        } else {
            // Standard format: "{pag}{line}({sec}): text"  e.g. "3a1(1): text"
            const re = /^(\d+'?[ab])(\d+)(?:\(([^)]*)\))?:\s*(.*)/;
            txt.split(/\r?\n/).forEach(raw => {
                const m = raw.match(re);
                if (!m) return;
                const [, pag, lnum, secCode = '', text] = m;
                if (!etextMap[pag]) etextMap[pag] = [];
                etextMap[pag].push({ line: lnum, text, sec: secCode });
            });
        }
    }

    function loadEtext(url) {
        const statusEl = document.getElementById('etext-status');
        const mainEl   = document.getElementById('etext-main');
        statusEl.textContent = 'loading…';
        fetch(url)
            .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
            .then(txt => {
                statusEl.textContent = '';
                parseEtext(txt);
                etextReady = true;
                document.getElementById('dico-section').style.display = '';
                const togBtn = document.getElementById('global-tib-toggle');
                if (togBtn) togBtn.classList.remove('d-none');
                if (currentPag) renderEtext(currentPag);
            })
            .catch(() => {
                statusEl.textContent = '';
                etextReady = true;
                mainEl.innerHTML = '<span class="no-etext">No etext available for this volume.</span>';
            });
    }

    function renderEtext(pag) {
        currentPag = pag;
        document.getElementById('etext-page-badge').textContent = pag || '—';
        // Complete etext links (one per text on this page)
        const completeLinksEl = document.getElementById('etext-complete-links');
        if (completeLinksEl) {
            const pagNum = pagToNum(pag);
            const entry = etextMap[pag];
            const hasEtextHere = !!(etextReady && entry &&
                (Array.isArray(entry) ? entry.length : (entry.lines && entry.lines.length)));
            const matches = hasEtextHere && catalogItems.length && pagNum >= 0
                ? catalogItems.filter(it => {
                    if (it.vol !== vol) return false;
                    if (sec && it.sec && it.sec !== sec) return false;
                    const s = it.debp ? pagToNum(it.debp + (it.debf || '')) : 0;
                    const e = it.finp ? pagToNum(it.finp + (it.finf || '')) : 99999;
                    return pagNum >= s && pagNum <= e && it.ref;
                })
                : [];
            const linkStyle = 'font-size:0.72rem;color:#2c6fad;text-decoration:none;margin-left:0.4rem;';
            completeLinksEl.innerHTML = matches.map(it =>
                '<a href="etext_complete.html?id=' + encodeURIComponent(it.ref) + '" target="_blank" ' +
                'style="' + linkStyle + '" title="View complete e-text: ' + esc(it.ref) + '">' +
                '<i class="bi bi-book"></i> ' + esc(it.ref) + '</a>'
            ).join('');
        }
        const dicoLink = document.getElementById('dico-link');
        if (dicoLink) {
            const dp = new URLSearchParams();
            if (title) dp.set('title', title);
            if (rkts)  dp.set('rkts',  rkts);
            if (coll)  dp.set('coll',  coll);
            if (vol)   dp.set('vol',   vol);
            if (sec)   dp.set('sec',   sec);
            if (pag)   dp.set('page',  pag);
            dicoLink.href = 'dico.html?' + dp.toString();
        }
        renderInfoPanel(pag);
        const mainEl  = document.getElementById('etext-main');
        const notesEl = document.getElementById('etext-notes');
        if (!etextReady) { mainEl.innerHTML = '<span class="no-etext">Loading etext…</span>'; return; }

        // Normalise entry: coll=A uses {lines,notes}; standard uses plain array
        const rawEntry = etextMap[pag];
        const isCollAEntry = rawEntry && !Array.isArray(rawEntry) && rawEntry.lines;

        let lines = isCollAEntry ? rawEntry.lines : rawEntry;
        let notes = isCollAEntry ? rawEntry.notes : null;

        if (lines && sec) {
            const hasSec = lines.some(l => l.sec);
            if (hasSec) {
                const filtered = lines.filter(l => l.sec === sec);
                if (filtered.length) lines = filtered;
            }
        }
        if (notes && sec) {
            const hasSec = notes.some(n => n.sec);
            if (hasSec) {
                const filtered = notes.filter(n => n.sec === sec);
                if (filtered.length) notes = filtered;
            }
        }
        if (!lines || !lines.length) {
            const volHint  = resolvedVolno    ? ' (volno\u00a0' + resolvedVolno + ')' : '';
            const pathHint = resolvedEtextUrl ? '<br><span style="font-size:0.7rem;color:#adb5bd;font-family:monospace;">'
                                              + esc(resolvedEtextUrl) + '</span>' : '';
            mainEl.innerHTML = '<span class="no-etext">No etext for page ' + esc(pag) + volHint + '.' + pathHint + '</span>';
            if (notesEl) { notesEl.innerHTML = ''; notesEl.style.display = 'none'; }
            return;
        }

        // Helper: highlight circled-number references ①–⑳ in text
        function highlightCircRefs(text) {
            return esc(text).replace(/[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]/g,
                m => '<span class="circ-ref">' + m + '</span>');
        }

        // Render main text lines
        let html = '';
        lines.forEach(l => {
            let displayText = l.text;
            let breakLabel  = '';
            if (displayText.startsWith('@@//')) {
                breakLabel  = '<span class="page-break-marker">&#9656; page start</span>';
                displayText = displayText.slice(4).replace(/^\s*/, '');
            } else if (displayText.startsWith('@@')) {
                breakLabel  = '<span class="page-break-marker">&#9656; ' + esc(displayText.match(/^@@([^/\s]*)/)?.[1] || '') + '</span>';
                displayText = displayText.replace(/^@@[^\s]*\s*/, '');
            }
            html += breakLabel +
                '<div class="eline">' +
                '<span class="eline-num">' + esc(l.line) + '</span>' +
                '<span class="eline-text script-text" data-lang="tib" data-original="' + esc(l.text.replace(/^@@[^\s]*\s*/, '')) + '">' +
                highlightCircRefs(displayText) +
                '</span>' +
                '</div>';
        });
        mainEl.innerHTML = html;
        mainEl.scrollTop = 0;

        // Render apparatus notes for coll=A in the separate notes panel
        if (notesEl) {
            if (notes && notes.length) {
                let notesHtml = '';
                notes.forEach(n => {
                    notesHtml += '<div class="eline note-line">' +
                        '<span class="eline-num">' + esc(n.num) + '</span>' +
                        '<span class="eline-text">' + highlightCircRefs(n.text) + '</span>' +
                        '</div>';
                });
                notesEl.innerHTML = '<div id="etext-notes-header">Notes</div>' + notesHtml;
                notesEl.style.display = '';
            } else {
                notesEl.innerHTML = '';
                notesEl.style.display = 'none';
            }
        }
        if (window.tibGlobalMode === 'unicode') applyTibMode('unicode');
    }

    const etextPane = document.getElementById('etext-pane');

    /* ── Resize handle ────────────────────────────────────────────── */
    (function () {
        const handle    = document.getElementById('resize-handle');
        const viewerRow = document.getElementById('viewer-row');
        let dragging = false, startY = 0, startH = 0;
        handle.addEventListener('mousedown', e => {
            dragging = true; startY = e.clientY; startH = viewerRow.offsetHeight;
            handle.classList.add('dragging');
            document.body.style.cursor = 'row-resize';
            document.body.style.userSelect = 'none';
        });
        document.addEventListener('mousemove', e => {
            if (!dragging) return;
            const newH = Math.max(100, Math.min(window.innerHeight * 0.85, startH + (e.clientY - startY)));
            viewerRow.style.height = newH + 'px';
        });
        document.addEventListener('mouseup', () => {
            if (!dragging) return;
            dragging = false;
            handle.classList.remove('dragging');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            if (osd) osd.viewport && osd.viewport.goHome(true);
        });
    })();

    /* ── Tibetan script toggle ────────────────────────────────────── */
    window.tibGlobalMode = 'ewts';

    function applyTibMode(mode) {
        document.querySelectorAll('.script-text[data-lang="tib"]').forEach(el => {
            const original = el.dataset.original || el.textContent;
            if (mode === 'unicode') {
                el.textContent = toUnicode(original);
                el.classList.add('tib');
            } else {
                // Restore with circ-ref highlighting if the element is an eline-text
                if (el.classList.contains('eline-text')) {
                    const highlighted = esc(original).replace(
                        /[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]/g,
                        m => '<span class="circ-ref">' + m + '</span>'
                    );
                    el.innerHTML = highlighted;
                } else {
                    el.textContent = original;
                }
                el.classList.remove('tib');
            }
        });
        const btn = document.getElementById('global-tib-toggle');
        if (btn) {
            btn.dataset.mode = mode;
            if (mode === 'unicode') {
                btn.title = 'Show in Wylie (EWTS)';
                btn.innerHTML = '<span class="toggle-label">Abc</span>';
            } else {
                btn.title = 'Show in Tibetan script';
                btn.innerHTML = '<i class="bi bi-translate"></i>';
            }
        }
    }

    document.addEventListener('click', e => {
        const btn = e.target.closest('.tib-toggle-btn');
        if (btn) {
            window.tibGlobalMode = window.tibGlobalMode === 'ewts' ? 'unicode' : 'ewts';
            applyTibMode(window.tibGlobalMode);
        }
    });

    /* ── Validate ─────────────────────────────────────────────────── */
    if (!title || !coll || !vol) { showError('Missing required URL parameters (title, coll, vol).'); return; }

    /* ── Kick off parallel loads ──────────────────────────────────── */
    loadInfoPanelData();
    loadAlignData();
    loadDharmanexusData();
    resolveEtextUrl().then(url => {
        if (url) { resolvedEtextUrl = url; loadEtext(url); }
        else {
            etextReady = true;
            document.getElementById('etext-main').innerHTML =
                '<span class="no-etext">No etext available for this collection.</span>';
        }
    });

    /* ── Volume JSON + manifest.txt + crop JSON ───────────────────── */
    const jsonUrl     = COLL_BASE + '/' + encodeURIComponent(coll) + '/' + encodeURIComponent(title) + '/' + encodeURIComponent(vol) + '.json';
    const manifestUrl = COLL_BASE + '/' + encodeURIComponent(coll) + '/' + encodeURIComponent(title) + '/manifest.txt';
    const cropUrl     = COLL_BASE + '/' + encodeURIComponent(coll) + '/' + encodeURIComponent(title) + '_Crop/' + encodeURIComponent(vol) + '.json';
    const notesUrl    = (coll === 'A')
        ? COLL_BASE + '/' + encodeURIComponent(coll) + '/' + encodeURIComponent(title) + '/notes/' + encodeURIComponent(vol) + '.json'
        : null;

    if (coll === 'A') {
        console.log('[coll=A] jsonUrl:', jsonUrl);
        console.log('[coll=A] notesUrl:', notesUrl);
    }

    setLoadMsg('Loading volume index…');

    const fetches = [
        fetch(jsonUrl).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status + ' – ' + jsonUrl); return r.json(); }),
        fetch(manifestUrl).then(r => r.ok ? r.text() : null).catch(() => null),
        fetch(cropUrl).then(r => r.ok ? r.json() : null).catch(() => null),
        notesUrl ? fetch(notesUrl).then(r => r.ok ? r.json() : null).catch(() => null) : Promise.resolve(null)
    ];

    Promise.all(fetches)
    .then(([data, tmplText, cropJson, notesJson]) => {
        if (tmplText) iiifTemplate = tmplText.trim();
        if (cropJson)  { cropData = cropJson; buildCropSeqMap(); }

        // Build a lookup map from img fileId → note fileId (for coll=A)
        const notesMap = {};
        if (notesJson) {
            console.log('[coll=A] notesJson loaded, sample key 1:', notesJson['1']);
            Object.keys(notesJson).forEach(k => {
                const entry = notesJson[k];
                if (entry && entry.img && entry.note) notesMap[entry.img] = entry.note;
            });
        } else if (coll === 'A') {
            console.log('[coll=A] notesJson is null — fetch failed or 404');
            console.log('[coll=A] main data sample key 1:', data['1']);
        }

        const pages = Object.keys(data)
            .filter(k => /^\d+$/.test(k))
            .sort((a, b) => parseInt(a, 10) - parseInt(b, 10))
            .map(k => {
                const entry = data[k];
                if (!entry) return null;
                // coll=A: match note by img == file (strip extension from file)
                if (coll === 'A') {
                    const fileId  = entry.file || entry.img || null;
                    const fileKey = fileId ? fileId.replace(/\.[^.]+$/, '') : null;
                    const noteFile = fileKey ? (notesMap[fileKey] || null) : null;
                    console.log('[coll=A] key', k, 'fileKey:', fileKey, 'noteFile:', noteFile);
                    return Object.assign({}, entry, { file: fileId, noteFile });
                }
                return entry;
            })
            .filter(Boolean);
        if (!pages.length) { showError('No pages found in volume JSON.'); return; }
        if (coll === 'A') {
            console.log('[coll=A] page[0]:', pages[0]);
            console.log('[coll=A] noteFile[0]:', pages[0].noteFile);
            if (pages[0].noteFile) console.log('[coll=A] note URL[0]:', iiifUrl(pages[0].noteFile));
        }

        // Build section selector if multiple sections
        buildSectionSelect(pages);

        let startIdx = 0;
        if (startPage) {
            let found = false, fallback = -1;
            for (let i = 0; i < pages.length; i++) {
                const pLabel = pages[i].pagination || ('p' + (i + 1));
                if (pLabel === startPage) {
                    if (!sec || pages[i].psection === sec) { startIdx = i; found = true; break; }
                    if (fallback < 0) fallback = i;
                }
            }
            if (!found && fallback >= 0) startIdx = fallback;
        } else if (sec) {
            for (let j = 0; j < pages.length; j++) {
                if (pages[j].psection === sec) { startIdx = j; break; }
            }
        }
        initViewer(pages, startIdx);
    })
    .catch(err => showError('Could not load volume index: ' + err.message));

    /* ── OpenSeadragon ────────────────────────────────────────────── */
    let osd        = null;
    let osd2       = null;   // second viewer for coll=A (note image)
    let currentIdx = 0;

    const btnFirst  = document.getElementById('btn-first');
    const btnPrev   = document.getElementById('btn-prev');
    const btnNext   = document.getElementById('btn-next');
    const btnLast   = document.getElementById('btn-last');
    const btnHome   = document.getElementById('btn-home');
    const pageLabel = document.getElementById('page-label');
    const secLabel  = document.getElementById('section-label');
    const pageCount = document.getElementById('page-count');
    const pageInput = document.getElementById('page-input');

    function gpbImageUrl(fileId) {
        // Gpb exception: images at www.rswb.org/rkts/Gpb/I{vol}/I{file on 4 digits}.png
        // fileId looks like "I1KG21608I0274.tif" — strip extension, take last 4 chars
        const base    = String(fileId).replace(/\.[^.]+$/, '');
        const fileNum = base.slice(-4).padStart(4, '0');
        return 'http://www.rswb.org/rkts/Gpb/I' + vol + '/I' + fileNum + '.png';
    }

    function collAImageUrl(fileId) {
        // coll=A: images at www.rswb.org/rkts/A/I{vol}/{localPart}.png
        // fileId is BDRC-style like "bdr:I1PD96784::I1PD967840020"
        // filename is the part after "::", stripped of leading "I" and extension
        const localPart = String(fileId).includes('::') ? fileId.split('::').pop() : String(fileId);
        const base      = localPart.replace(/\.[^.]+$/, '').replace(/^I/, '');
        return 'http://www.rswb.org/rkts/A/I' + vol + '/' + base + '.jpg';
    }

    function collBImageUrl(fileId) {
        // coll=B (Berlin Kanjur): IIIF images at content.staatsbibliothek-berlin.de/dc/{fileId}
        // fileId is like "1928259464-0001" (manifest ID stem); append /info.json for IIIF fetch
        return 'https://content.staatsbibliothek-berlin.de/dc/' + String(fileId) + '/info.json';
    }

    function iiifUrl(fileId) {
        if (coll === 'Gpb') return gpbImageUrl(fileId);
        if (coll === 'A')   return collAImageUrl(fileId);
        if (coll === 'B')   return collBImageUrl(fileId);
        if (iiifTemplate) {
            const volSafe = vol.replace(/-/g, '_');
            return iiifTemplate.replace('yyy', encodeURIComponent(volSafe))
                               .replace('xxx', encodeURIComponent(fileId));
        }
        if (/^https?:\/\//i.test(fileId)) {
            const base = fileId.replace(/\/+$/, '');
            return base.endsWith('/info.json') ? base : base + '/info.json';
        }
        return 'https://iiif.bdrc.io/' + fileId + '/info.json';
    }

    function normalizeIiifInfo(info) {
        if (Array.isArray(info.profile) && info.profile.length &&
                typeof info.profile[0] === 'object' && info.profile[0] !== null) {
            const p0 = info.profile[0], p1 = info.profile[1] || {};
            const lvl = p0['@id'] || 'http://iiif.io/api/image/2/level1.json';
            const merged = {};
            [p0, p1].forEach(src => {
                Object.keys(src).forEach(k => { if (k !== '@id' && src[k] != null) merged[k] = src[k]; });
            });
            info.profile = [lvl, merged];
        }
        return info;
    }

    function openIiif(fileId, noteFileId) {
        const url = iiifUrl(fileId);
        // Clear previous image and stale errors immediately
        if (osd) osd.close();
        document.getElementById('error-overlay').style.display = 'none';
        setLoadMsg('Loading image…');
        loadingEl.style.display = 'flex';
        const mUrl = document.getElementById('manifest-url');
        if (mUrl) { mUrl.textContent = url; mUrl.href = url; }

        // Gpb or A: plain PNG — load directly as a simple image tile source
        // (coll=B uses standard IIIF fetch below)
        if (coll === 'Gpb' || coll === 'A') {
            pendingCrop = null;
            currentImageUrl = url;
            osd.open({ type: 'image', url: url });

            // coll=A: also load note image in second viewer
            console.log('openIiif coll=A noteFileId:', noteFileId, 'osd2:', !!osd2);
            if (coll === 'A' && osd2 && noteFileId) {
                const noteUrl = iiifUrl(noteFileId);
                console.log('opening note URL:', noteUrl);
                const loading2 = document.getElementById('loading2-overlay');
                const mUrl2 = document.getElementById('manifest-url2');
                if (mUrl2) { mUrl2.textContent = noteUrl; mUrl2.href = noteUrl; }
                osd2.open({ type: 'image', url: noteUrl });
                if (loading2) loading2.style.display = 'none';
            }
            return;
        }

        fetch(url)
            .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(info => {
                info = normalizeIiifInfo(info);
                if (!info['@id']) info['@id'] = url.replace(/\/info\.json$/, '');
                currentImageUrl = info['@id'];
                pendingCrop = computeCrop(currentPage, info.width, info.height);
                osd.open(info);
            })
            .catch(err => {
                if (osd) osd.close();
                loadingEl.style.display = 'none';
                showError('Failed to load IIIF image for page ' +
                          (pages[currentIdx] ? pages[currentIdx].pagination : '?') +
                          ' – ' + err.message);
            });
    }

    function updateNav(pages, idx) {
        const p   = pages[idx];
        const pag = p.pagination || ('p' + (idx + 1));
        pageLabel.textContent = pag;

        if (p.psection && p.psection !== sec) {
            sec = p.psection;
            document.getElementById('meta-sec').textContent = sec;
            document.getElementById('meta-sec-wrap').style.display = '';
            // Sync section selector
            const sel = document.getElementById('sec-select');
            if (sel) sel.value = sec;
        }
        secLabel.textContent = sec || '';
        pageCount.textContent = (idx + 1) + '\u202f/\u202f' + pages.length;
        btnFirst.disabled = idx === 0;
        btnPrev.disabled  = idx === 0;
        btnNext.disabled  = idx === pages.length - 1;
        btnLast.disabled  = idx === pages.length - 1;
        const sp = new URLSearchParams(window.location.search);
        sp.set('page', pag);
        if (sec) sp.set('sec', sec); else sp.delete('sec');
        history.replaceState(null, '', '?' + sp.toString());
        renderEtext(pag);
    }

    function goTo(pages, idx) {
        if (idx < 0 || idx >= pages.length) return;
        currentIdx  = idx;
        currentPage = pages[idx];
        updateNav(pages, idx);
        if (pages[idx].file === 'missing') { hideMissing(); showMissing(pages[idx].pagination || ('p' + (idx + 1))); }
        else { hideMissing(); openIiif(pages[idx].file, pages[idx].noteFile || null); }
    }

    function initViewer(pages, startIdx) {
        setLoadMsg('Initialising viewer…');

        // coll=A: enable side-by-side layout
        if (coll === 'A') {
            const wrap2 = document.getElementById('viewer2-wrap');
            if (wrap2) wrap2.classList.add('visible');
            const lbl = document.getElementById('viewer-label');
            if (lbl) lbl.classList.add('visible');
        }

        osd = OpenSeadragon({
            id:                    'viewer',
            prefixUrl:             'https://cdn.jsdelivr.net/npm/openseadragon@4.1/build/openseadragon/images/',
            showNavigationControl: false,
            animationTime:         0.3,
            blendTime:             0.1,
            constrainDuringPan:    false,
            maxZoomPixelRatio:     4,
            minZoomImageRatio:     0.5,
            visibilityRatio:       0.5,
            defaultZoomLevel:      0,
            tileSources:           null
        });

        osd.addHandler('open', function () {
            if (pendingCrop) {
                const c = pendingCrop; pendingCrop = null;
                const tiledImage = osd.world.getItemAt(0);
                if (tiledImage) {
                    const imageRect    = new OpenSeadragon.Rect(c.x, c.y, c.w, c.h);
                    tiledImage.setClip(imageRect);
                    const viewportRect = tiledImage.imageToViewportRectangle(imageRect);
                    osd.viewport.fitBounds(viewportRect, true);
                }
            }
            let done = false;
            function finish() { if (!done) { done = true; hideLoading(); } }
            // Plain-image sources (Gpb, A) don't reliably fire tile-drawn — hide immediately
            if (coll === 'Gpb' || coll === 'A') {
                finish();
            } else {
                osd.addOnceHandler('tile-drawn', finish);
                setTimeout(finish, 8000);
            }
        });
        osd.addHandler('open-failed', (e) => {
            const url = (e && e.options && e.options.tileSource && e.options.tileSource.url)
                      ? ' (' + e.options.tileSource.url + ')' : '';
            showError('Failed to load image for page ' + pages[currentIdx].pagination + '.' + url);
        });

        // coll=A: initialise second viewer for note images
        if (coll === 'A') {
            osd2 = OpenSeadragon({
                id:                    'viewer2',
                prefixUrl:             'https://cdn.jsdelivr.net/npm/openseadragon@4.1/build/openseadragon/images/',
                showNavigationControl: false,
                animationTime:         0.3,
                blendTime:             0.1,
                constrainDuringPan:    false,
                maxZoomPixelRatio:     4,
                minZoomImageRatio:     0.5,
                visibilityRatio:       0.5,
                defaultZoomLevel:      0,
                tileSources:           null
            });
        }

        btnFirst.addEventListener('click', () => goTo(pages, 0));
        btnPrev.addEventListener('click',  () => goTo(pages, currentIdx - 1));
        btnNext.addEventListener('click',  () => goTo(pages, currentIdx + 1));
        btnLast.addEventListener('click',  () => goTo(pages, pages.length - 1));
        btnHome.addEventListener('click',  () => { if (osd) osd.viewport.goHome(true); });

        const btnFs   = document.getElementById('btn-fullscreen');
        const fsTarget = document.getElementById('viewer-wrap');
        btnFs.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                fsTarget.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        });
        document.addEventListener('fullscreenchange', () => {
            const icon = btnFs.querySelector('i');
            if (document.fullscreenElement) {
                icon.className = 'bi bi-fullscreen-exit';
                btnFs.title    = 'Exit full screen';
            } else {
                icon.className = 'bi bi-fullscreen';
                btnFs.title    = 'Full screen';
            }
        });

        document.getElementById('btn-save-jpg').addEventListener('click', () => {
            if (!currentImageUrl) { alert('No image loaded.'); return; }
            const pag = pageLabel.textContent.trim() || 'page';
            // For plain images (Gpb, A) currentImageUrl is direct; for IIIF construct full-res URL
            const dlUrl = (coll === 'Gpb' || coll === 'A')
                ? currentImageUrl
                : currentImageUrl + '/full/full/0/default.jpg';
            const ext      = dlUrl.includes('.png') ? 'png' : 'jpg';
            const filename = pag + '.' + ext;
            fetch(dlUrl)
                .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
                .then(blob => {
                    const url = URL.createObjectURL(blob);
                    const a   = document.createElement('a');
                    a.href = url; a.download = filename;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                })
                .catch(e => alert('Download failed: ' + e.message));
        });

        document.addEventListener('keydown', e => {
            if (e.target === pageInput) return;
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); goTo(pages, currentIdx + 1); }
            if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); goTo(pages, currentIdx - 1); }
            if (e.key === 'Home') { e.preventDefault(); goTo(pages, 0); }
            if (e.key === 'End')  { e.preventDefault(); goTo(pages, pages.length - 1); }
        });

        pageInput.addEventListener('keydown', e => {
            if (e.key !== 'Enter') return;
            const target = pageInput.value.trim();
            pageInput.value = '';
            const found = pages.findIndex(p => p.pagination === target);
            if (found >= 0) {
                goTo(pages, found);
            } else {
                pageInput.style.borderColor = '#a04040';
                setTimeout(() => { pageInput.style.borderColor = '#ced4da'; }, 1000);
            }
        });

        currentIdx  = startIdx;
        currentPage = pages[startIdx];
        updateNav(pages, startIdx);
        if (pages[startIdx].file === 'missing') showMissing(pages[startIdx].pagination || ('p' + (startIdx + 1)));
        else openIiif(pages[startIdx].file, pages[startIdx].noteFile || null);
    }

})();
</script>
</body>
</html>
