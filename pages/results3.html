<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rKTs – ID Lookup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../configuration/style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../configuration/favicon-32x32.png">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="../configuration/rkts-logo.png" alt="rKTs logo">
                <div>
                    <span>Resources for Kanjur and Tanjur Studies</span>
                    <small lang="bo">བཀའ་བསྟན་རིག་པའི་མཐུན་སྦྱོར།</small>
                </div>
            </a>
        </div>
    </nav>

    <!-- Error area (hidden until needed) -->
    <div class="container mt-5" id="error-area" style="display:none">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="alert alert-warning" role="alert">
                    <h4 class="alert-heading">Entry not found</h4>
                    <p class="mb-3" id="error-msg"></p>
                    <hr>
                    <p class="mb-0">
                        Enter a sigla + number (e.g. <code>D125</code>, <code>F247</code>, <code>Gpb12</code>)
                        or a plain rKTs number (e.g. <code>147</code>).
                    </p>
                </div>
                <a href="search.html" class="btn btn-primary">&larr; Back to Search</a>
            </div>
        </div>
    </div>

    <!-- Loading indicator -->
    <div class="container mt-5 text-center" id="loading-area">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted mt-2 small">Looking up entry…</p>
    </div>

    <script>
    (function () {
        const COLL_BASE = '../data/collections';
        const TYP2_MAP  = { '1':'K', '2':'T', '3':'G', '5':'B' };

        function esc(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function showError(msg) {
            document.getElementById('loading-area').style.display = 'none';
            document.getElementById('error-msg').innerHTML = msg;
            document.getElementById('error-area').style.display = '';
        }

        function redirect(id) {
            window.location.replace('detail.html?id=' + encodeURIComponent(id));
        }

        const P   = new URLSearchParams(window.location.search);
        const raw = (P.get('text') || '').trim();

        if (!raw) {
            window.location.replace('search.html?err=empty');
            return;
        }

        const m = raw.match(/^([A-Za-z]+)(.+)$/);

        if (m) {
            // sigla + local number
            const sigla    = m[1];
            const localNum = m[2];
            const ref      = sigla + localNum;

            const xmlUrl = COLL_BASE + '/' + encodeURIComponent(sigla) + '/' + encodeURIComponent(sigla) + '.xml';

            fetch(xmlUrl)
                .then(r => {
                    if (!r.ok) throw new Error('not_found');
                    return r.text();
                })
                .then(xmlText => {
                    const doc  = new DOMParser().parseFromString(xmlText, 'application/xml');
                    if (doc.querySelector('parsererror'))
                        throw new Error('parse_error');

                    // Find first <item> whose <ref> matches exactly
                    const item = Array.from(doc.querySelectorAll('item')).find(it => {
                        const refEl = it.querySelector('ref');
                        return refEl && refEl.textContent.trim() === ref;
                    });

                    if (!item)
                        throw new Error('no_entry');

                    const rkts = (item.querySelector('rkts') || {}).textContent?.trim() || '';
                    const cat  = (item.querySelector('cat')  || {}).textContent?.trim() || '';

                    if (!rkts || !cat)
                        throw new Error('incomplete');

                    redirect(cat + rkts);
                })
                .catch(err => {
                    if (err.message === 'not_found')
                        showError('Collection file not found for sigla <strong>' + esc(sigla) + '</strong>.');
                    else if (err.message === 'parse_error')
                        showError('Could not parse collection file for sigla <strong>' + esc(sigla) + '</strong>.');
                    else if (err.message === 'no_entry')
                        showError('No entry found for reference <strong>' + esc(ref) + '</strong> in collection <strong>' + esc(sigla) + '</strong>.');
                    else if (err.message === 'incomplete')
                        showError('Incomplete data for reference <strong>' + esc(ref) + '</strong> (missing rkts or cat).');
                    else
                        showError('Unexpected error: ' + esc(err.message));
                });

        } else {
            // Plain number → direct redirect with typ2
            if (!/^\d+$/.test(raw)) {
                showError('Invalid ID format: <strong>' + esc(raw) + '</strong>. Expected a sigla+number (e.g. D125) or a plain rKTs number (e.g. 147).');
                return;
            }
            const typ2 = P.get('typ2') || '1';
            const cat  = TYP2_MAP[typ2] || 'K';
            redirect(cat + raw);
        }
    })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
